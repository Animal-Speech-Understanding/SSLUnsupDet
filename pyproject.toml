[project]
name = "sslunsupdet"
version = "0.1.0"
description = ""
authors = [
    {name = "Victor",email = "69643322+blueberry13-8@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "soundfile (>=0.13.1,<0.14.0)",
    "librosa (>=0.11.0,<0.12.0)",
    "numpy (>=2.2.5,<3.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "scipy (>=1.15.2,<2.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "tensorboard (>=2.19.0,<3.0.0)",
    "pytorch-lightning (>=2.5.1.post0,<3.0.0)",
    "torchmetrics (>=1.7.1,<2.0.0)",
    "ipython (>=9.2.0,<10.0.0)",
    "torchaudio (>=2.7.0,<3.0.0)",
    "google-cloud-storage (>=3.1.0,<4.0.0)",
    "torch (>=2.7.0,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
package-mode = false


[[tool.poetry.source]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu118"
priority = "explicit"


[tool.poetry.dependencies]
torch = {source = "pytorch-gpu"}
